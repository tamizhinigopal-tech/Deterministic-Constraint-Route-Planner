services:
  # Database Service (PostgreSQL)
  - type: pgbouncer
    name: dynos-db
    databaseName: dynos
    plan: free # Render offers a free tier for Postgres
    region: ohio

  # Backend Service (FastAPI)
  - type: web
    name: dynos-backend
    env: python
    region: ohio
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dynos-db
          property: connectionString
      - key: AI_PROVIDER
        value: mock # Set to claude when you get an API key
      # - key: ANTHROPIC_API_KEY
      #   sync: false

  # Frontend Service (React + Vite)
  - type: web
    name: dynos-frontend
    env: static
    region: ohio
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dynos-backend
          envVarKey: RENDER_EXTERNAL_URL
